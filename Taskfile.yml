version: '3'

vars:
  VERSION:
    sh: python3 -c 'import json; print(json.load(open("package.json"))["version"])'
  HUB_NAMESPACE: '{{.DOCKERHUB_NAMESPACE | default "willdockerhub"}}'
  RELEASE_REPO: '{{.GITHUB_REPOSITORY | default "weironz/assay"}}'

env:
  LOCAL_CI_VERSION: '{{.VERSION}}'
  LOCAL_CI_DOCKERHUB_NAMESPACE: '{{.HUB_NAMESPACE}}'
  LOCAL_CI_GITHUB_REPOSITORY: '{{.RELEASE_REPO}}'

tasks:
  default:
    desc: List local and GitHub pipeline tasks (never deploys)
    cmds: ['task --list']
  doctor:
    desc: Check local Docker, Rust, GitHub CLI and version prerequisites
    cmds: ['python3 scripts/local-ci/run.py doctor']
  auth:check:
    desc: Check publication credentials without publishing or deploying
    cmds: ['python3 scripts/local-ci/run.py auth-check']
  test:
    desc: Run deployment, frontend, backend and Rust tests in sequence
    cmds:
      - task: test:deployment
      - task: test:web
      - task: test:api
      - task: test:cli
      - task: test:agent
  test:deployment:
    desc: Validate deployment templates, backup boundaries and local CI safety
    cmds:
      - task: deploy:check
      - python3 scripts/local-ci/run.py test-deployment
  test:web:
    desc: Build the frontend test stage and run the locked Bun tests
    cmds: ['python3 scripts/local-ci/run.py test-web']
  test:api:
    desc: Test the API with disposable PostgreSQL and Redis containers
    cmds: ['python3 scripts/local-ci/run.py test-api']
  test:cli:
    desc: Run the Rust CLI tests
    cmds: ['python3 scripts/local-ci/run.py test-cli']
  test:agent:
    desc: Check Rust formatting, clippy and Samba Agent tests
    cmds: ['python3 scripts/local-ci/run.py test-agent']
  test:samba-acl:
    desc: Verify no-delete and administrator exceptions on an explicitly isolated Samba test domain
    cmds: ['{{.SAMBA_TEST_PYTHON | default "python3"}} deploy/samba-test/tests/no-delete-e2e.py']
  build:
    desc: Build the three Docker images and Linux/Windows release binaries
    cmds:
      - task: build:images
      - task: build:cli
  build:images:
    desc: Build API, Web and Samba Agent images locally, without pushing
    cmds: ['python3 scripts/local-ci/run.py build-images']
  build:cli:
    desc: Cross-compile Linux musl and Windows MSVC CLI artifacts
    cmds: ['python3 scripts/local-ci/run.py build-cli']
  test:smoke:
    desc: Run login, ticket, branding, MFA and throttling checks on an isolated stack
    cmds: ['python3 scripts/local-ci/run.py smoke']
  test:upgrade:
    desc: Restore a protected production backup into disposable services and verify the upgrade
    cmds: ['python3 scripts/local-ci/run.py test-upgrade']
  ci:
    desc: Run the complete local verification pipeline; does not publish or deploy
    cmds:
      - task: doctor
      - task: test
      - task: build
      - task: test:smoke
      - python3 scripts/local-ci/run.py verify
  check:
    desc: Test and smoke-check application images without publishing or cross-compiling CLI releases
    cmds:
      - task: test
      - task: build:images
      - task: test:smoke
  push:images:
    desc: Push only verified version tags to Docker Hub (does not update latest)
    cmds: ['python3 scripts/local-ci/run.py push-images']
  release:
    desc: Publish verified binaries, checksums and image digests to GitHub Release
    cmds: ['python3 scripts/local-ci/run.py release']
  publish:
    desc: Push verified images and publish GitHub Release; NEVER deploys production
    cmds:
      - task: push:images
      - task: release
  deploy:production:
    desc: Deploy a rehearsed, published release through Ansible (explicit production action)
    cmds: ['python3 scripts/local-ci/run.py deploy']
  tools:ansible:
    desc: Install the pinned Ansible control environment locally
    cmds:
      - python3 -m venv .local-ci/tools/ansible
      - .local-ci/tools/ansible/bin/python -m pip install -r deploy/ansible/requirements.txt
  deploy:check:
    desc: Check Ansible syntax without connecting to production
    cmds:
      - python3 scripts/local-ci/deployment.py --syntax-check
      - python3 scripts/local-ci/deployment.py --syntax-check --profile samba
  local:ci:
    desc: Run tests and builds on this machine
    cmds: [{task: ci}]
  local:publish:
    desc: Publish locally verified images and binaries; never deploy
    cmds: [{task: publish}]
  local:deploy:
    desc: Deploy locally verified and rehearsed release through Ansible
    cmds: [{task: deploy:production}]
  samba:backup:
    desc: Back up and verify the explicitly selected existing company file-server deployment through Ansible
    cmds: ['python3 scripts/local-ci/company.py backup']
  samba:backup:verify:
    desc: Revalidate an existing full company backup after tooling changes, without downloading images again
    cmds: ['python3 scripts/local-ci/company.py recheck']
  local:deploy:samba:
    desc: Deploy verified API/Web/Agent images to an existing company stack through Ansible
    cmds: ['python3 scripts/local-ci/company.py deploy']
  samba:policy:
    desc: Apply an explicit department no-delete policy and leadership access after backup and deployment
    cmds: ['python3 scripts/local-ci/company.py policy']
  samba:runtime:
    desc: Revalidate installed published images and backup before post-release permissions maintenance
    cmds: ['python3 scripts/local-ci/company.py runtime']
  samba:verify:
    desc: Verify department and leadership rights with a temporary SMB identity, without employee passwords
    cmds: ['python3 scripts/local-ci/company.py verify']
  github:ci:
    desc: Dispatch the GitHub CI route on the dedicated self-hosted runner
    env: {ASSAY_ACTION: ci}
    cmds: ['python3 scripts/local-ci/actions.py']
  github:publish:
    desc: Dispatch GitHub test, build and publication; never deploy
    env: {ASSAY_ACTION: publish}
    cmds: ['python3 scripts/local-ci/actions.py']
  github:deploy:
    desc: Dispatch Ansible production deployment of an already rehearsed release
    env: {ASSAY_ACTION: deploy}
    cmds: ['python3 scripts/local-ci/actions.py']
  status:
    desc: Show local verification and publishing receipts for this version
    cmds: ['python3 scripts/local-ci/run.py status']
