# 阿里云环境可选的公共 Traefik。已有代理时不安装、不覆盖。
# 在独立目录部署；不能与 Assay 共用 .env 或默认 Compose 项目名。
# cp traefik.env.example .env
# docker network create traefik-network
# docker compose -p traefik -f traefik.compose.yaml up -d

services:
  traefik:
    image: ${TRAEFIK_IMAGE:-traefik:v3.6.10}
    restart: always
    command:
      - "--providers.docker=true"
      # 只暴露显式打了 traefik.enable=true 的容器，避免把内部服务也代理出去
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=traefik-network"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      # 80 端口仅做 HTTPS 跳转；证书通过 443 的 TLS-ALPN-01 校验
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--certificatesresolvers.letsencrypt.acme.tlschallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL:?set ACME_EMAIL}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # 只读挂载 docker socket：Traefik 只需要读容器标签
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # 证书必须持久化，否则每次重启都重新申请，很快会撞上 Let's Encrypt 限流
      - letsencrypt:/letsencrypt
    networks: [traefik-network]

networks:
  traefik-network:
    external: true

volumes:
  letsencrypt:
