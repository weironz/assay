server {
  listen 80;
  server_name _;
  resolver 127.0.0.11 valid=5s ipv6=off;
  location = /healthz {
    allow 127.0.0.1;
    deny all;
    set $assay_api api:3000;
    proxy_pass http://$assay_api/health;
  }
  location / { return 404; }
}
server {
  listen 443 ssl;
  server_name _;
  ssl_certificate /tls/web.crt;
  ssl_certificate_key /tls/web.key;
  ssl_protocols TLSv1.2 TLSv1.3;
  # 512MB 单文件 + multipart 头开销；与 apps/web/nginx.conf 保持同一口径
  client_max_body_size 513m;
  root /usr/share/nginx/html;
  index index.html;
  resolver 127.0.0.11 valid=5s ipv6=off;
  location /api/ {
    set $assay_api api:3000;
    proxy_pass http://$assay_api;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_http_version 1.1;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
  }
  location / { try_files $uri $uri/ /index.html; }
}
