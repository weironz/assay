server {
  listen 80;
  server_name _;
  resolver 127.0.0.11 valid=5s ipv6=off;
  resolver_timeout 3s;
  location = /test-ca.crt { root /usr/share/nginx/html; }
  location = /healthz {
    allow 127.0.0.1;
    deny all;
    set $assay_api api:3000;
    proxy_pass http://$assay_api/health;
  }
  location / { return 302 https://$host:8446$request_uri; }
}
server {
  listen 443 ssl;
  server_name _;
  ssl_certificate /tls/web.crt;
  ssl_certificate_key /tls/web.key;
  ssl_protocols TLSv1.2 TLSv1.3;
  client_max_body_size 55m;
  root /usr/share/nginx/html;
  index index.html;
  # Compose may assign a new API IP on recreation; refresh Docker DNS at runtime.
  resolver 127.0.0.11 valid=5s ipv6=off;
  resolver_timeout 3s;
  location = /test-ca.crt { }
  location /api/ {
    set $assay_api api:3000;
    proxy_pass http://$assay_api;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 60s;
  }
  location / { try_files $uri $uri/ /index.html; }
}
