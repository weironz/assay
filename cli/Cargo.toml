[package]
name = "assay-cli"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Assay ticket system command-line client and local MCP server"
repository = "https://github.com/weironz/assay"

[[bin]]
name = "assay"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive", "env", "wrap_help"] }
dirs = "6.0"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rpassword = "7.3"
semver = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
