name: Samba Agent
on:
  workflow_dispatch: null
permissions:
  contents: read
jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: agents/samba
      - run: cargo fmt --manifest-path agents/samba/Cargo.toml --check
      - run: cargo clippy --locked --manifest-path agents/samba/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --locked --manifest-path agents/samba/Cargo.toml
      - run: docker build -t assay-samba-agent:ci agents/samba
