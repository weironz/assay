name: Task CI / CD

# Taskfile is the shared entry point. Pushes/PRs only test; publishing and
# deploying are independent explicit operations on a trusted persistent runner.
on:
  workflow_dispatch:
    inputs:
      operation:
        description: ci = test/build; publish = test/build/release; deploy = rehearsed release only
        required: true
        type: choice
        default: ci
        options:
        - ci
        - publish
        - deploy
      version:
        description: Exact X.Y.Z matching package versions
        required: true
        type: string
      expected_sha:
        description: Exact commit SHA; task github:* supplies this automatically
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: assay-${{ github.event_name == 'workflow_dispatch' && 'release' || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tests:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: go-task/setup-task@v1
        with: {version: '3.54.0'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: dtolnay/rust-toolchain@stable
        with: {components: 'rustfmt, clippy'}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            cli -> ../.local-ci/cache/target-cli
            agents/samba -> ../../.local-ci/cache/target-agent
      - run: task tools:ansible
      - run: task check

  pipeline:
    if: github.event_name == 'workflow_dispatch' && inputs.operation != 'deploy' && (github.ref == 'refs/heads/main' || github.ref == format('refs/tags/v{0}', inputs.version))
    runs-on: [self-hosted, Linux, X64, assay-release]
    environment: release
    permissions:
      contents: write
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      EXPECTED_SHA: ${{ inputs.expected_sha }}
      LOCAL_CI_STATE_DIR: ${{ vars.ASSAY_CI_STATE_DIR }}
      DOCKERHUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE || 'willdockerhub' }}
      GITHUB_REPOSITORY: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: false}
      - name: Validate source and persistent runner state
        run: python3 scripts/local-ci/actions_check.py
      - name: Test and build through Taskfile
        run: task local:ci VERSION="$RELEASE_VERSION"
      - name: Publish verified release (never deploy)
        if: inputs.operation == 'publish'
        env:
          ASSAY_RELEASE_GITHUB_TOKEN: ${{ github.token }}
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME || 'willdockerhub' }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: task local:publish VERSION="$RELEASE_VERSION"

  deploy:
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'deploy' && (github.ref == 'refs/heads/main' || github.ref == format('refs/tags/v{0}', inputs.version))
    runs-on: [self-hosted, Linux, X64, assay-release]
    environment: production
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      EXPECTED_SHA: ${{ inputs.expected_sha }}
      LOCAL_CI_STATE_DIR: ${{ vars.ASSAY_CI_STATE_DIR }}
      DOCKERHUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE || 'willdockerhub' }}
      GITHUB_REPOSITORY: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: false}
      - name: Validate source and persistent runner state
        run: python3 scripts/local-ci/actions_check.py
      - name: Deploy through Taskfile and the shared Ansible playbook
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
          DEPLOY_DIR: ${{ vars.DEPLOY_DIR }}
          DEPLOY_OFFLINE: ${{ vars.DEPLOY_OFFLINE || 'false' }}
          DEPLOY_BECOME: ${{ vars.DEPLOY_BECOME || 'false' }}
          DEPLOY_BECOME_PASSWORD: ${{ secrets.DEPLOY_BECOME_PASSWORD }}
          ASSAY_DEPLOY_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          ASSAY_DEPLOY_HOST_KEYS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        # Release/upgrade receipts and local images must already be valid on
        # this runner. Missing rehearsal or a different SHA fails closed.
        run: python3 scripts/local-ci/actions_deploy.py
