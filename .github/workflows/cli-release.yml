name: Release Assay CLI

on:
  push:
    tags: ['assay-cli-v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '已存在的 assay-cli-vX.Y.Z 标签'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            asset: assay-x86_64-unknown-linux-musl
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: assay-x86_64-pc-windows-msvc.exe
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install musl cross linker
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build release binary
        working-directory: cli
        run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Stage asset (Linux)
        if: runner.os == 'Linux'
        run: cp cli/target/${{ matrix.target }}/release/assay ${{ matrix.asset }}
      - name: Stage asset (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Copy-Item cli/target/${{ matrix.target }}/release/assay.exe ${{ matrix.asset }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Generate checksums
        run: (cd dist && sha256sum assay-* > SHA256SUMS)
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: gh release create "$TAG" dist/assay-* dist/SHA256SUMS --title "Assay CLI ${TAG#assay-cli-v}" --generate-notes
