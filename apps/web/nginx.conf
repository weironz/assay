# 真实客户端 IP：只信任「确切的可信反代地址」，采纳其 X-Forwarded-For 中的
# 客户端地址（递归回溯到链上第一个不可信地址）；其余连接一律保留 remote_addr
# （直连来源地址）语义。客户端自带/伪造的 X-Real-IP / X-Forwarded-For 会被忽略，
# 保证后端限流与审计拿到的是不可伪造的地址。
#
# !!! 切勿放开 10/8、172.16/12、192.168/16 这类整段私网 !!!
# 同一内网/容器网段的普通客户端只要自带 X-Forwarded-For 就能伪装任意 IP、
# 绕过后端按 IP 的登录限流。只信任本次部署中实际反代的确切地址：
set_real_ip_from 127.0.0.1;   # 反代装在与本容器同一台宿主上（如宝塔/宿主 Nginx/Traefik）
set_real_ip_from ::1;
set_real_ip_from 172.17.0.1;  # Docker 默认 bridge 网关：宿主上的反代经 docker 端口映射进来时，来源即此地址
#
# 仓库自带生产部署的反代固定地址（compose 里 ipv4_address 与这里一一对应，改动必须同步）：
set_real_ip_from 172.30.10.10;  # deploy/aliyun：Traefik 容器在 traefik-network 上的固定地址
set_real_ip_from 172.31.10.10;  # deploy/aliyun-Cloudflare-Tunnel：cloudflared 容器在 tunnel 网络上的固定地址
#
# 按部署形态调整（编辑镜像内此文件重新构建，或在部署侧挂载同名文件）：
# 1) 局域网/公网「无反代直连」部署：不需要任何额外条目，保持现状即可——
#    192.168.x.x / 10.x.x.x 的直连客户端不可信，X-Forwarded-For 无效，remote_addr
#    即真实客户端（安全默认）。
# 2) 反代与本服务同处一个自定义 docker 网络（如 deploy/aliyun 的 Traefik）：
#    用 `docker network inspect <网络名>` 查到反代容器的 IPv4 地址，加一条
#    `set_real_ip_from <反代容器IP>;`；若给反代容器在 compose 里固定了
#    ipv4_address，则填写该固定地址最稳妥。
# 3) 反代在宿主上但连接经 docker 自定义网络端口映射进来：
#    `docker network inspect <网络名>` 查 Gateway（如 172.20.0.1）并加入。
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# 转发协议：优先用上游代理(如 Traefik)传入的头，否则回退到直连值
map $http_x_forwarded_proto $fwd_proto {
    default $scheme;
    ~.      $http_x_forwarded_proto;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 附件上传体积。必须 > apps/api/src/attachments/limits.ts 的 MAX_ATTACHMENT_MB，
    # 否则大文件在 nginx 就被 413 掉，界面上写的限制成了空话。
    # 这里限制的是整个 multipart 请求体：512MB 的文件外还有 boundary、字段头等
    # 几百字节开销，所以留 1MB 余量（513m），正好 512MB 的文件才不会被误杀。
    client_max_body_size 513m;

    # 响应压缩：JS/CSS/JSON/SVG 均为文本资源，gzip 后体积约为原始的 1/3~1/4
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # 静态资源缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # index.html 只引用带 hash 的资源，本身必须每次回源校验：
    # 否则浏览器对无缓存头的响应用启发式缓存，发版后旧 index 会指向已不存在的资源
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # API 反向代理（含 better-auth 的 /api/auth）→ 后端；与 SPA 路由隔离
    location /api/ {
        # 用变量 + resolver 让 nginx 在「每次请求」而不是「启动时」解析上游：
        # 1) api 容器还没起来时 nginx 不会启动失败
        # 2) api 容器重建换 IP 后不会一直打到旧 IP
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $upstream_api http://api:3000;
        proxy_pass $upstream_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # realip 模块改写后的 $remote_addr 才是可信客户端地址，直接覆盖，
        # 不透传任何客户端自带头
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;

        # 大附件相关：
        # 1) 关闭请求体缓冲，让 nginx 边收边转给后端。默认会先把整个 512MB
        #    落到 nginx 自己的临时盘再转发，白白多一次磁盘写还拖长耗时。
        # 2) 超时按「慢网络传 512MB」放宽——默认 60s/120s 传大文件必断。
        proxy_request_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # SPA 前端路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }
}
