# 真实客户端 IP / 协议：优先用上游代理(如 Traefik)传入的头，否则回退到直连值
map $http_x_real_ip $client_ip {
    default $remote_addr;
    ~.      $http_x_real_ip;
}
map $http_x_forwarded_proto $fwd_proto {
    default $scheme;
    ~.      $http_x_forwarded_proto;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 附件上传体积。必须 >= apps/api/src/attachments/limits.ts 的 MAX_ATTACHMENT_MB，
    # 否则大文件在 nginx 就被 413 掉，界面上写的限制成了空话。
    client_max_body_size 512m;

    # 静态资源缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # API 反向代理（含 better-auth 的 /api/auth）→ 后端；与 SPA 路由隔离
    location /api/ {
        # 用变量 + resolver 让 nginx 在「每次请求」而不是「启动时」解析上游：
        # 1) api 容器还没起来时 nginx 不会启动失败
        # 2) api 容器重建换 IP 后不会一直打到旧 IP
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $upstream_api http://api:3000;
        proxy_pass $upstream_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $client_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;

        # 大附件相关：
        # 1) 关闭请求体缓冲，让 nginx 边收边转给后端。默认会先把整个 512MB
        #    落到 nginx 自己的临时盘再转发，白白多一次磁盘写还拖长耗时。
        # 2) 超时按「慢网络传 512MB」放宽——默认 60s/120s 传大文件必断。
        proxy_request_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # SPA 前端路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }
}
